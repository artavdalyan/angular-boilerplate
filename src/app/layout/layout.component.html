<nz-layout id="layout" class="min-h-dvh">
  <nz-sider [(nzCollapsed)]="isCollapsed" [nzTrigger]="null" [nzWidth]="220" nzCollapsible class="bg-white">
    <div class="logo">
      <img alt="logo" src="assets/images/logo.svg" width="90" />
    </div>
    <ul class="sidebar-nav general" nz-menu nzMode="inline" nzNoAnimation nzTheme="light">
      <ng-container *ngFor="let menu of menuItems">
        <ng-container *ngIf="menu.submenu?.length">
          <li [nzIcon]="null"  [nzTitle]="menu.title" [routerLinkActive]="''" class="sidebar-nav__item" nz-submenu>
            <ul class="sidebar-nav">
              <li
                [queryParams]="submenu.queryParam"
                [routerLink]="submenu.path"
                [routerLinkActive]="'ant-menu-item-selected'"
                *ngFor="let submenu of menu.submenu"
                class="sidebar-nav__item"
                nz-menu-item
              >
                {{ submenu.title }}
              </li>
            </ul>
          </li>
        </ng-container>
        <ng-container *ngIf="!menu.submenu?.length">
          <li
            [queryParams]="menu.queryParam"
            [routerLink]="menu.path"
            [routerLinkActive]="'ant-menu-item-selected'"
            class="sidebar-nav__item"
            nz-menu-item
          >
            <div class="flex items-center">
              <span>{{ menu.title }}</span>
            </div>
          </li>
        </ng-container>
      </ng-container>
    </ul>
  </nz-sider>
  <nz-layout>
    <nz-header class="bg-white">
      <div class="flex">
        <i (click)="isCollapsed = !isCollapsed" [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'" class="trigger" nz-icon></i>
        <ul class="ms-auto flex items-center gap-8 ">
            <div routerLink="/notifications" class="py-1.5 px-5 text-sm bg-white rounded-[30px] border border-solid border-midnight-200 flex items-center gap-3">
              <span>You have <span class="text-green-600">21</span> new trips</span>
              <span class="icon-size-5 bell-icon animate__swing" nz-icon nzType="icons:bell"></span>
            </div>
            <app-language-switcher />
            <app-user />
        </ul>
      </div>
    </nz-header>
    <nz-content>
      <router-outlet></router-outlet>
    </nz-content>
  </nz-layout>
</nz-layout>
