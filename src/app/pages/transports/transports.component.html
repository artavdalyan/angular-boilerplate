<nz-table nzBordered nzNoResult [nzData]="transportsData" [nzShowPagination]="false">
  <thead>
    <tr>
      <th>Transport Mode</th>
      <th>Enable / Disable</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let data of transportsData">
      <td>{{ data.mode }}</td>
      <td>
        <nz-switch [(ngModel)]="data.checked"></nz-switch>
      </td>
    </tr>
  </tbody>
</nz-table>

<div class="mt-10 flex flex-col rounded-lg bg-white">
  <div class="mx-4 pt-4 text-2xl font-black">Trips</div>
  <apx-chart
    [series]="chartOptions.series!"
    [chart]="chartOptions.chart!"
    [dataLabels]="chartOptions.dataLabels!"
    [plotOptions]="chartOptions.plotOptions!"
    [xaxis]="chartOptions.xaxis!"
    [yaxis]="chartOptions.yaxis!"
    [legend]="chartOptions.legend!"
    [colors]="chartOptions.colors!"
  ></apx-chart>
  <div class="mb-4 flex flex-col items-center">
    <h2 class="text-2xl font-black">5000</h2>
    <h6 class="text-truncate text-midnight-400">5 % higher than last month</h6>
  </div>
</div>
