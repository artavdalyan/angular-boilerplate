<div class="grid grid-cols-2 gap-4 p-2 md:grid-cols-3">
  @for (event of eventsData(); track event) {
    <div class="flex flex-col rounded-2xl border-b border-gray-200 bg-white p-4">
      <img alt="event" class="rounded-lg object-cover" src="{{ event.image_url }}" />
      <p class="mt-2 text-xl text-primary-600">{{ event.date_range }}</p>
      <h3 class="mt-1 text-base font-semibold">{{ event.title }}</h3>
      <p class="mt-1 text-sm">{{ event.description }}</p>
    </div>
  }
</div>
